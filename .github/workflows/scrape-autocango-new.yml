name: Scrape AutoCango (new cars)

on:
  schedule:
    # Daily 22:00 UTC = 06:00 Beijing. Offset from used-car job at 21:00.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Hard cap on listing pages to walk'
        required: false
        default: '100'
      collect_limit:
        description: 'Max new IDs to upsert this run'
        required: false
        default: '5000'
      scrape_limit:
        description: 'Max detail pages to scrape this run'
        required: false
        default: '500'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps + playwright
        run: |
          pip install -r requirements-scrapling.txt
          python -m playwright install chromium --with-deps

      - name: Collect newcar listings (no filters, paginate all)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python collect_autocango_new.py \
            --max-pages ${{ inputs.max_pages    || 100 }} \
            --limit     ${{ inputs.collect_limit || 5000 }}

      - name: Scrape newcar detail pages (full-res photos)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scrape_autocango_new.py --limit ${{ inputs.scrape_limit || 500 }}
