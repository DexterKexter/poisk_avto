name: Scrape AutoCango (fleet pricelists)

# Fleet offers update slowly and don't need a cron. Trigger manually
# when you want to refresh — typically right after a new ACF appears on
# /fleet, or to refresh the xlsx pricelists after dealer updates.
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps + playwright
        run: |
          pip install -r requirements-scrapling.txt
          pip install openpyxl
          python -m playwright install chromium --with-deps

      - name: Scrape fleet offers + download xlsx pricelists
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scrape_autocango_fleet.py
