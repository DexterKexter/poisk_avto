name: Test playwright bypass (dongchedi/encar)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps + playwright
        run: |
          pip install -r requirements-scrapling.txt
          python -m playwright install chromium --with-deps
      - name: Test
        run: python test_playwright_dongchedi_encar.py
