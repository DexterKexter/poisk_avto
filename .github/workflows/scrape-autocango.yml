name: Scrape AutoCango

on:
  schedule:
    # Every 12 hours at :45. autocango is a low-refresh aggregator — twice
    # a day is plenty. Re-enabled after switching to Scrapling/Oxylabs
    # stealth fetch (see collect_autocango.py + stealth.py).
    - cron: '45 */12 * * *'
  workflow_dispatch:
    inputs:
      cities:
        description: 'Cities (comma-separated)'
        required: false
        default: 'Shanghai,Guangzhou,Shenzhen,Beijing,Tianjin,Chengdu'
      pages_per_city:
        description: 'Max listing pages per city'
        required: false
        default: '20'
      min_price:
        description: 'Minimum price in USD'
        required: false
        default: '5000'
      min_year:
        description: 'Minimum model year'
        required: false
        default: '2021'
      original_paint:
        description: 'Original-paint tab code (22 = strict)'
        required: false
        default: '22'
      collect_limit:
        description: 'Max new IDs to upsert this run'
        required: false
        default: '5000'
      scrape_limit:
        description: 'Max detail pages to scrape this run'
        required: false
        default: '500'

concurrency:
  group: scrape-autocango
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # GITHUB_RUN_URL is consumed by scrape_*.py -> DB.sync_log_start so each
    # row in the admin 'Последние запуски' panel deep-links back to the
    # exact GH Actions run for log inspection.
    env:
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps + Scrapling/Camoufox
        run: |
          pip install -r requirements-scrapling.txt
          # Camoufox = custom Firefox build with stealth patches that
          # Scrapling drives. The `scrapling install` command downloads
          # the ~100 MB binary into ~/.scrapling/ once.
          python -m scrapling install
          # playwright/chromium kept for any legacy fallback paths
          python -m playwright install chromium --with-deps

      - name: Collect quality listings (6 cities + filters)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Oxylabs Realtime API as Scrapling's fallback. The collector
          # tries Scrapling/Camoufox first; if a Tencent EdgeOne challenge
          # still shows, it falls back to Oxylabs CN-geo + render=html.
          OXY_USER: ${{ secrets.OXY_USER }}
          OXY_PASS: ${{ secrets.OXY_PASS }}
        run: |
          python collect_autocango.py \
            --cities         "${{ inputs.cities         || 'Shanghai,Guangzhou,Shenzhen,Beijing,Tianjin,Chengdu' }}" \
            --pages-per-city ${{ inputs.pages_per_city || 20 }} \
            --min-price      ${{ inputs.min_price      || 5000 }} \
            --min-year       ${{ inputs.min_year       || 2021 }} \
            --original-paint ${{ inputs.original_paint || 22 }} \
            --limit          ${{ inputs.collect_limit  || 5000 }}

      - name: Scrape detail pages (full-res photos)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Same Scrapling → Oxylabs ladder for detail pages — they live
          # behind the same WAF as the listings.
          OXY_USER: ${{ secrets.OXY_USER }}
          OXY_PASS: ${{ secrets.OXY_PASS }}
        run: |
          python scrape_autocango.py --limit ${{ inputs.scrape_limit || 500 }}
