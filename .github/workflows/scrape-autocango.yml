name: Scrape AutoCango

on:
  # 12-hour cron paused. Autocango serves a Tencent TEO CAPTCHA challenge
  # to GitHub runners, and the universal Oxylabs Realtime API doesn't
  # solve it — every fetch returns the captcha HTML and runs end with
  # `Done in 77s. Upserted: 0 new IDs.` Re-enable once we wire a
  # solver-capable proxy (Oxylabs Web Unblocker / Bright Data Web Unlocker).
  # schedule:
  #   - cron: '45 */12 * * *'
  workflow_dispatch:
    inputs:
      cities:
        description: 'Cities (comma-separated)'
        required: false
        default: 'Shanghai,Guangzhou,Shenzhen,Beijing,Tianjin,Chengdu'
      pages_per_city:
        description: 'Max listing pages per city'
        required: false
        default: '20'
      min_price:
        description: 'Minimum price in USD'
        required: false
        default: '5000'
      min_year:
        description: 'Minimum model year'
        required: false
        default: '2021'
      original_paint:
        description: 'Original-paint tab code (22 = strict)'
        required: false
        default: '22'
      collect_limit:
        description: 'Max new IDs to upsert this run'
        required: false
        default: '5000'
      scrape_limit:
        description: 'Max detail pages to scrape this run'
        required: false
        default: '500'

concurrency:
  group: scrape-autocango
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # GITHUB_RUN_URL is consumed by scrape_*.py -> DB.sync_log_start so each
    # row in the admin 'Последние запуски' panel deep-links back to the
    # exact GH Actions run for log inspection.
    env:
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps + playwright
        run: |
          pip install -r requirements-scrapling.txt
          python -m playwright install chromium --with-deps

      - name: Collect quality listings (6 cities + filters)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python collect_autocango.py \
            --cities         "${{ inputs.cities         || 'Shanghai,Guangzhou,Shenzhen,Beijing,Tianjin,Chengdu' }}" \
            --pages-per-city ${{ inputs.pages_per_city || 20 }} \
            --min-price      ${{ inputs.min_price      || 5000 }} \
            --min-year       ${{ inputs.min_year       || 2021 }} \
            --original-paint ${{ inputs.original_paint || 22 }} \
            --limit          ${{ inputs.collect_limit  || 5000 }}

      - name: Scrape detail pages (full-res photos)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scrape_autocango.py --limit ${{ inputs.scrape_limit || 500 }}
