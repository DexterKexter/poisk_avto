name: Normalize CN cars via LLM

# LLM-assisted second-pass normalizer for Chinese sources. Picks up rows
# the hardcoded `chinese_maps` first pass didn't fully resolve (missing
# mark, CJK-leaked model, missing engine_type) and ships them to Kimi K2.6
# via OpenRouter for canonical English re-classification.
#
# Idempotent: each run only touches rows with llm_normalized_at IS NULL.
# Use the `force` input to re-process already-stamped rows after model
# upgrade or prompt edit.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max rows to process (blank = all pending)'
        required: false
        default: ''
      source:
        description: 'Restrict to single source: che168 / guazi / autocango'
        required: false
        default: ''
      batch_size:
        description: 'Rows per LLM call (default 40)'
        required: false
        default: '40'
      force:
        description: 'Re-normalize already-stamped rows (true/false)'
        required: false
        default: 'false'
      model:
        description: 'OpenRouter model id (default moonshotai/kimi-k2.6)'
        required: false
        default: ''
  # Hourly cron paused. The LLM normalizer was mis-classifying some
  # Chinese listings — instead of extracting the model name it stored
  # year-version fragments like "2023款" / "2025款" as the canonical
  # model and promoted them into the `models` table via FK. ~33
  # garbage rows in `models` came from this. Re-enable once the prompt /
  # post-validation rejects `^\d{4}款$` before INSERT. Manual
  # workflow_dispatch stays usable.
  # schedule:
  #   - cron: '50 * * * *'

concurrency:
  group: normalize-llm
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests

      - name: Run LLM normalizer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ];      then ARGS="$ARGS --limit ${{ inputs.limit }}";           fi
          if [ -n "${{ inputs.source }}" ];     then ARGS="$ARGS --source ${{ inputs.source }}";         fi
          if [ -n "${{ inputs.batch_size }}" ]; then ARGS="$ARGS --batch-size ${{ inputs.batch_size }}"; fi
          if [ -n "${{ inputs.model }}" ];      then ARGS="$ARGS --model ${{ inputs.model }}";           fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force";                              fi
          python normalize_cars_llm.py $ARGS
