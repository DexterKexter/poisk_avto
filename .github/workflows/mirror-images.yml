name: Mirror blocked images to Supabase Storage

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max cars to process (blank = all)"
        required: false
        default: ""
      source:
        description: "Restrict to single source (e.g. che168)"
        required: false
        default: ""
  # Auto-run on this branch when the mirror script changes (until merged to main)
  push:
    branches: [claude/new-session-LVrLC]
    paths:
      - mirror_images.py
      - .github/workflows/mirror-images.yml

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run mirror
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ARGS=""
          # Push-triggered = full backfill on che168 (the only source with
          # autoimg.cn URLs). Manual dispatch honours its inputs.
          if [ "${{ github.event_name }}" = "push" ]; then
            ARGS="--source che168"
          else
            if [ -n "${{ inputs.limit }}" ];  then ARGS="$ARGS --limit ${{ inputs.limit }}";   fi
            if [ -n "${{ inputs.source }}" ]; then ARGS="$ARGS --source ${{ inputs.source }}"; fi
          fi
          python mirror_images.py --workers 6 $ARGS
