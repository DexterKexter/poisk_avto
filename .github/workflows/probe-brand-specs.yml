name: Probe brand specs URL
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-scrapling.txt && python -m playwright install chromium --with-deps
      - run: python probe_brand_specs.py
