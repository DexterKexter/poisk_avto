name: Recon yiche.com

# Probe yiche.com (易车) — Chinese auto portal with new car prices,
# used cars, dealer info. Hit 3 URLs to figure out parser strategy.

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Probe yiche.com
        env:
          OXY_USER: ${{ secrets.OXY_USER }}
          OXY_PASS: ${{ secrets.OXY_PASS }}
        run: python recon_yiche.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-yiche-${{ github.run_id }}
          path: recon_artifacts/
          retention-days: 14
