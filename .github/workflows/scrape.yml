name: Scrape Dongchedi

on:
  workflow_dispatch:
    inputs:
      cities:
        description: 'Cities (comma-separated)'
        required: false
        default: 'beijing,shanghai,guangzhou,shenzhen'
      brands:
        description: "Brand IDs (comma-separated) or 'all' (default: all 79)"
        required: false
        default: 'all'
      scrolls:
        description: 'Scrolls per (city,brand) request'
        required: false
        default: '8'
      batch_size:
        description: 'Parallel requests per batch'
        required: false
        default: '4'
      batch_pause:
        description: 'Seconds between batches'
        required: false
        default: '3'
      min_year:
        description: 'Skip cars older than this year (0 = no filter)'
        required: false
        default: '2022'
      collect_limit:
        description: 'Max new IDs to upsert in collect step'
        required: false
        default: '10000'
      scrape_limit:
        description: 'Max cards to scrape this run'
        required: false
        default: '2000'
      workers:
        description: 'Parallel card workers'
        required: false
        default: '10'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect IDs (brand × city XHR)
        env:
          OXY_USER: ${{ secrets.OXY_USER }}
          OXY_PASS: ${{ secrets.OXY_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python collect_ids.py \
            --cities      "${{ inputs.cities      || 'beijing,shanghai,guangzhou,shenzhen' }}" \
            --brands      "${{ inputs.brands      || 'all' }}" \
            --scrolls     ${{ inputs.scrolls      || 8 }} \
            --batch-size  ${{ inputs.batch_size   || 4 }} \
            --batch-pause ${{ inputs.batch_pause  || 3 }} \
            --min-year    ${{ inputs.min_year     || 2022 }} \
            --limit       ${{ inputs.collect_limit || 10000 }}

      - name: Scrape pending cards
        env:
          OXY_USER: ${{ secrets.OXY_USER }}
          OXY_PASS: ${{ secrets.OXY_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scrape_dongchedi.py --skip-listing \
            --limit   ${{ inputs.scrape_limit || 2000 }} \
            --workers ${{ inputs.workers      || 10 }}
