name: Scrape Dongchedi

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect IDs (10 iterations)
        env:
          OXY_USER: ${{ secrets.OXY_USER }}
          OXY_PASS: ${{ secrets.OXY_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          for i in {1..10}; do
            echo "=== Iteration $i / 10 ==="
            python collect_ids.py --limit 5000 --scrolls 10 || echo "  (iteration $i failed, continuing)"
            sleep 3
          done

      - name: Scrape up to 500 cards
        env:
          OXY_USER: ${{ secrets.OXY_USER }}
          OXY_PASS: ${{ secrets.OXY_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scrape_dongchedi.py --skip-listing --limit 500 --workers 10
