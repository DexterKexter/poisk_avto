name: Scrape Dongchedi

on:
  workflow_dispatch:
    inputs:
      cities:
        description: 'Cities (comma-separated)'
        required: false
        default: 'beijing,shanghai,guangzhou,shenzhen'
      scrolls:
        description: 'Scrolls per city (XHR pages ≈ scrolls × 20 cars)'
        required: false
        default: '10'
      min_year:
        description: 'Skip cars older than this year (0 = no filter)'
        required: false
        default: '2022'
      collect_limit:
        description: 'Max new IDs to upsert in collect step'
        required: false
        default: '5000'
      scrape_limit:
        description: 'Max cards to scrape this run'
        required: false
        default: '500'
      workers:
        description: 'Parallel card workers'
        required: false
        default: '10'
  # schedule:
  #   - cron: '0 19 * * *'    # 03:00 Beijing — uncomment for daily refresh

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect IDs (XHR capture, multi-city, year filter)
        env:
          OXY_USER: ${{ secrets.OXY_USER }}
          OXY_PASS: ${{ secrets.OXY_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python collect_ids.py \
            --cities   "${{ inputs.cities   || 'beijing,shanghai,guangzhou,shenzhen' }}" \
            --scrolls  ${{ inputs.scrolls   || 10 }} \
            --min-year ${{ inputs.min_year  || 2022 }} \
            --limit    ${{ inputs.collect_limit || 5000 }}

      - name: Scrape pending cards
        env:
          OXY_USER: ${{ secrets.OXY_USER }}
          OXY_PASS: ${{ secrets.OXY_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scrape_dongchedi.py --skip-listing \
            --limit   ${{ inputs.scrape_limit || 500 }} \
            --workers ${{ inputs.workers      || 10 }}
