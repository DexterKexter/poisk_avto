name: Scrape che168

on:
  # Cron paused — che168 detail scraping is too slow/lossy from CI IPs without
  # a proxy. Re-enable by uncommenting. Manual dispatch still works.
  # schedule:
  #   - cron: '15 */4 * * *'
  workflow_dispatch:
    inputs:
      cities:
        description: 'Cities (comma-separated keys)'
        required: false
        default: 'Beijing,Shanghai,Guangzhou,Shenzhen,Chengdu,Hangzhou'
      pages_per_city:
        required: false
        default: '30'
      min_year:
        required: false
        default: '2020'
      max_mileage_km:
        required: false
        default: '100000'
      min_price_cny:
        required: false
        default: '5000'
      collect_limit:
        required: false
        default: '15000'
      scrape_limit:
        required: false
        default: '3000'
      workers:
        required: false
        default: '4'

concurrency:
  group: scrape-che168
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # GITHUB_RUN_URL is consumed by scrape_*.py -> DB.sync_log_start so each
    # row in the admin 'Последние запуски' panel deep-links back to the
    # exact GH Actions run for log inspection.
    env:
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps + playwright
        run: |
          pip install -r requirements-scrapling.txt
          python -m playwright install chromium --with-deps

      - name: Collect listings (6 cities + filters)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python collect_che168.py \
            --cities         "${{ inputs.cities         || 'Beijing,Shanghai,Guangzhou,Shenzhen,Chengdu,Hangzhou' }}" \
            --pages-per-city ${{ inputs.pages_per_city || 30 }} \
            --min-year       ${{ inputs.min_year       || 2020 }} \
            --max-mileage-km ${{ inputs.max_mileage_km || 100000 }} \
            --min-price-cny  ${{ inputs.min_price_cny  || 5000 }} \
            --limit          ${{ inputs.collect_limit  || 15000 }}

      - name: Scrape detail pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scrape_che168.py \
            --limit   ${{ inputs.scrape_limit || 3000 }} \
            --workers ${{ inputs.workers      || 4 }}

      # autoimg.cn ships images without Cross-Origin-Resource-Policy,
      # which Chrome ORB blocks in <img>/<Image>. Re-host every fresh
      # listing's photos in Supabase Storage so they render in browsers.
      # Idempotent: a car whose images are already on our CDN is skipped.
      - name: Mirror blocked images to Supabase Storage
        if: always()  # run even if scrape step failed for some rows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python mirror_images.py --source che168 --workers 6
