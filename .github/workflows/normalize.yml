name: Normalize cars (apply chinese_maps)

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to normalize"
        required: false
        default: 'all'
        type: choice
        options: ['all','che168','guazi','autocango']
      dry_run:
        description: 'Dry-run (no DB writes)'
        required: false
        default: 'false'
        type: choice
        options: ['true','false']

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python normalize_cars.py --source "${{ inputs.source || 'all' }}" \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
