name: Import brands (autocango)

# Scrapes /ucbrand and populates the brands table.
# Run on demand. Re-runs upsert (idempotent).

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 22:00 UTC = refresh counts
    - cron: '0 22 * * 1'

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps + playwright
        run: |
          pip install -r requirements-scrapling.txt
          python -m playwright install chromium --with-deps
      - name: Import brands
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python import_brands_autocango.py

      - name: Enrich missing logos (autocango grid)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python enrich_brand_logos.py

      - name: Enrich missing logos (Clearbit fallback)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python enrich_brand_logos_clearbit.py
