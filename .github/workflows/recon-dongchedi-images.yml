name: Recon dongchedi images
on:
  workflow_dispatch:
    inputs:
      sku_id:
        description: 'dongchedi sku_id (optional)'
        required: false
        default: '23406092'
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - env:
          OXY_USER: ${{ secrets.OXY_USER }}
          OXY_PASS: ${{ secrets.OXY_PASS }}
        run: python recon_dongchedi_images.py "${{ inputs.sku_id }}"
