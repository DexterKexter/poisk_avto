name: Recon autocango /carspecs

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps + playwright
        run: |
          pip install -r requirements-scrapling.txt
          python -m playwright install chromium --with-deps
      - name: Probe /carspecs
        run: python recon_autocango_specs.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-specs-${{ github.run_id }}
          path: recon_artifacts/
          retention-days: 7
