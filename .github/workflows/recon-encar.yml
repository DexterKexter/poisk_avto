name: Recon encar.com

# One-shot probe of encar.com to figure out the right scraping strategy
# (HTML render vs direct API, XHR capture, geo, anti-bot).
# Triggered manually via Actions UI. Artifacts get uploaded for inspection.

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Probe encar.com
        env:
          OXY_USER: ${{ secrets.OXY_USER }}
          OXY_PASS: ${{ secrets.OXY_PASS }}
        run: python recon_encar.py

      - name: Upload recon artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-encar-${{ github.run_id }}
          path: recon_artifacts/
          retention-days: 14
