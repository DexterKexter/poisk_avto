name: Scrape Encar

on:
  schedule:
    # Daily 20:00 UTC = 05:00 Seoul (next day). Discovers + scrapes new cars.
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'API batches to fetch (200 cars each via direct API)'
        required: false
        default: '10'
      page_size:
        description: 'Cars per API batch (max ~200)'
        required: false
        default: '200'
      min_year:
        description: 'Skip cars older than this year (0 = no filter)'
        required: false
        default: '0'
      collect_limit:
        description: 'Max new IDs to upsert in collect step'
        required: false
        default: '5000'
      scrape_limit:
        description: 'Max cards to scrape this run'
        required: false
        default: '1000'
      workers:
        description: 'Parallel batch workers (each batch = 5 cars via API)'
        required: false
        default: '5'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect IDs (encar listing pagination)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python collect_encar.py \
            --pages       ${{ inputs.pages         || 10 }} \
            --page-size   ${{ inputs.page_size     || 200 }} \
            --min-year    ${{ inputs.min_year      || 0 }} \
            --limit       ${{ inputs.collect_limit || 5000 }}

      - name: Scrape pending cards (batched API)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scrape_encar.py \
            --limit   ${{ inputs.scrape_limit || 1000 }} \
            --workers ${{ inputs.workers      || 5 }}
