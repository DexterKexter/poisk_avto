name: Recon autocango.com

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scrapling + playwright
        run: |
          pip install -r requirements-scrapling.txt
          # Install Chromium for playwright
          python -m playwright install chromium --with-deps

      - name: Probe autocango.com via scrapling
        run: python recon_autocango.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-autocango-${{ github.run_id }}
          path: recon_artifacts/
          retention-days: 7
