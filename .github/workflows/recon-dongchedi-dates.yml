name: Recon dongchedi dates

# One-shot probe: pick an existing dongchedi card from cars,
# fetch its detail page, and dump every date-shaped field in
# props.pageProps.skuDetail. Used to find where the publication
# date lives so we can populate cars.published_at for dongchedi.

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Probe dongchedi date fields
        env:
          OXY_USER: ${{ secrets.OXY_USER }}
          OXY_PASS: ${{ secrets.OXY_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python recon_dongchedi_dates.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-dongchedi-dates-${{ github.run_id }}
          path: recon_artifacts/
          retention-days: 7
