name: Scrape guazi EN

on:
  schedule:
    - cron: '45 */3 * * *'
  workflow_dispatch:
    inputs:
      brands:
        required: false
        default: ''
        description: 'Comma-separated brand slugs (empty = auto-discover)'
      max_pages_per_brand:
        required: false
        default: '50'
      min_year:
        required: false
        default: '2021'
      max_mileage_km:
        required: false
        default: '100000'
      min_price_usd:
        required: false
        default: '7000'
      grades:
        required: false
        default: 'S,A'
        description: 'Comma-separated grades to keep (S,A,B,C,D or empty=all)'
      collect_limit:
        required: false
        default: '20000'
      scrape_limit:
        required: false
        default: '3000'
      workers:
        required: false
        default: '4'

concurrency:
  group: scrape-guazi-en
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps + playwright
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Collect listings (en.guazi.com)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GUAZI_EMAIL: ${{ secrets.GUAZI_EMAIL }}
          GUAZI_PASSWORD: ${{ secrets.GUAZI_PASSWORD }}
        run: |
          python collect_guazi_en.py \
            --brands             "${{ inputs.brands             || '' }}" \
            --max-pages-per-brand ${{ inputs.max_pages_per_brand || 50 }} \
            --min-year            ${{ inputs.min_year            || 2021 }} \
            --max-mileage-km      ${{ inputs.max_mileage_km     || 100000 }} \
            --min-price-usd       ${{ inputs.min_price_usd      || 7000 }} \
            --grades             "${{ inputs.grades             || 'S,A' }}" \
            --limit               ${{ inputs.collect_limit      || 20000 }}

      - name: Scrape detail pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GUAZI_EMAIL: ${{ secrets.GUAZI_EMAIL }}
          GUAZI_PASSWORD: ${{ secrets.GUAZI_PASSWORD }}
        run: |
          python scrape_guazi_en.py \
            --limit   ${{ inputs.scrape_limit || 3000 }} \
            --workers ${{ inputs.workers      || 4 }}
