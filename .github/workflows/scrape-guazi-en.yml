name: Scrape guazi EN

on:
  schedule:
    - cron: '45 */3 * * *'
  workflow_dispatch:
    inputs:
      min_year:
        required: false
        default: '2021'
      max_mileage_km:
        required: false
        default: '100000'
      min_price_usd:
        required: false
        default: '7000'
      grades:
        required: false
        default: 'S,A'
        description: 'Grades: S,A,B,C,D (comma-separated)'
      seller_types:
        required: false
        default: '180003,180002'
        description: '180003=Guazi Owned, 180002=Certified Dealer'
      max_pages:
        required: false
        default: '500'
      collect_limit:
        required: false
        default: '20000'
      scrape_limit:
        required: false
        default: '3000'
      workers:
        required: false
        default: '4'

concurrency:
  group: scrape-guazi-en
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps + playwright
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Collect listings (en.guazi.com)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GUAZI_EMAIL: ${{ secrets.GUAZI_EMAIL }}
          GUAZI_PASSWORD: ${{ secrets.GUAZI_PASSWORD }}
        run: |
          python collect_guazi_en.py \
            --min-year       ${{ inputs.min_year       || 2021 }} \
            --max-mileage-km ${{ inputs.max_mileage_km || 100000 }} \
            --min-price-usd  ${{ inputs.min_price_usd  || 7000 }} \
            --grades        "${{ inputs.grades         || 'S,A' }}" \
            --seller-types  "${{ inputs.seller_types   || '180003,180002' }}" \
            --max-pages      ${{ inputs.max_pages      || 500 }} \
            --limit          ${{ inputs.collect_limit   || 20000 }}

      - name: Scrape detail pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GUAZI_EMAIL: ${{ secrets.GUAZI_EMAIL }}
          GUAZI_PASSWORD: ${{ secrets.GUAZI_PASSWORD }}
        run: |
          python scrape_guazi_en.py \
            --limit   ${{ inputs.scrape_limit || 3000 }} \
            --workers ${{ inputs.workers      || 4 }}
