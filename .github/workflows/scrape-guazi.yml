name: Scrape guazi (en.guazi.com)

on:
  schedule:
    # Every 2 hours at :30 (offset from encar :00 and che168 :15).
    - cron: '30 */2 * * *'
  workflow_dispatch:
    inputs:
      brands:
        description: 'CSV of brand names to scrape (empty = all from DB)'
        required: false
        default: ''
      max_pages:
        description: 'Max listing pages per brand'
        required: false
        default: '10'
      min_year:
        required: false
        default: '2018'
      max_mileage_km:
        required: false
        default: '150000'
      min_price_usd:
        required: false
        default: '2000'
      collect_limit:
        required: false
        default: '15000'
      scrape_limit:
        required: false
        default: '1000'

concurrency:
  group: scrape-guazi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps + playwright
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Collect listings from en.guazi.com
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python collect_guazi.py \
            --brands         "${{ inputs.brands || '' }}" \
            --max-pages      ${{ inputs.max_pages      || 10 }} \
            --min-year       ${{ inputs.min_year       || 2018 }} \
            --max-mileage-km ${{ inputs.max_mileage_km || 150000 }} \
            --min-price-usd  ${{ inputs.min_price_usd  || 2000 }} \
            --limit          ${{ inputs.collect_limit  || 15000 }}

      - name: Scrape detail pages (Playwright)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scrape_guazi.py \
            --limit   ${{ inputs.scrape_limit || 1000 }}
