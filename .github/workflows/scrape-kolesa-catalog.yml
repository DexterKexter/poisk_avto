name: Scrape kolesa catalog

# kolesa.kz brand/model reference catalog (kolesa_brands / kolesa_models).
# Reference data for the KZ price matcher — full refresh twice a month.
on:
  schedule:
    - cron: '0 4 1,15 * *'   # 1st & 15th of each month, 04:00 UTC
  workflow_dispatch:
    inputs:
      limit_brands:
        description: 'Only first N brands (0 = all)'
        required: false
        default: '0'
      only:
        description: 'Comma-separated brand slugs (empty = all)'
        required: false
        default: ''
      delay:
        description: 'Base delay between brand pages (seconds)'
        required: false
        default: '2.5'
      skip_models:
        description: 'Only refresh brand list (true/false)'
        required: false
        default: 'false'
      resume:
        description: 'Skip brands that already have models (true/false). Scheduled runs do a full refresh (false) so new models are picked up.'
        required: false
        default: 'false'

concurrency:
  group: scrape-kolesa-catalog
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Scrape kolesa catalog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scrape_kolesa_catalog.py \
            --limit-brands ${{ inputs.limit_brands || 0 }} \
            --only        "${{ inputs.only || '' }}" \
            --delay        ${{ inputs.delay || 2.5 }} \
            ${{ (inputs.skip_models == 'true') && '--skip-models' || '' }} \
            ${{ (inputs.resume == 'true') && '--resume' || '' }}
